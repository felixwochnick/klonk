# Entwicklung: Datenbank; mit `--profile sso` zusätzlich Test-LDAP (glauth) und Test-OIDC (Dex),
# mit `--profile pdf` der PDF-Dienst für Unterrichtsmaterial (Gotenberg, :3005 ⇒ NUXT_GOTENBERG_URL=http://localhost:3005)
name: klonk-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: klonk
      POSTGRES_PASSWORD: klonk
      POSTGRES_DB: klonk
    ports:
      - "5432:5432"
    volumes:
      - klonk-dev-db:/var/lib/postgresql

  glauth:
    image: glauth/glauth:latest
    profiles: [sso]
    volumes:
      - ./dev/glauth.cfg:/app/config/config.cfg:ro
    ports:
      - "3893:3893"

  dex:
    image: ghcr.io/dexidp/dex:latest
    profiles: [sso]
    command: ["dex", "serve", "/etc/dex/config.yml"]
    volumes:
      - ./dev/dex.yml:/etc/dex/config.yml:ro
    ports:
      - "5556:5556"
    depends_on:
      - glauth

  gotenberg:
    image: gotenberg/gotenberg:8
    profiles: [pdf]
    command: [gotenberg, --libreoffice-auto-start=true, --chromium-disable-routes, --webhook-disable, --api-timeout=120s, --api-body-limit=50MB]
    ports:
      - "3005:3000"

volumes:
  klonk-dev-db:
