# Selbsthosting: App, Verwaltung und Postgres. Migrationen laufen automatisch beim Start.
# Pflicht: KLONK_APP_SECRET und KLONK_ENCRYPTION_KEY (je `openssl rand -base64 32`)
name: klonk

x-env: &env
  NUXT_DATABASE_URL: postgres://klonk:${POSTGRES_PASSWORD:-klonk}@postgres:5432/klonk
  NUXT_APP_SECRET: ${KLONK_APP_SECRET:?KLONK_APP_SECRET fehlt}
  NUXT_ENCRYPTION_KEY: ${KLONK_ENCRYPTION_KEY:?KLONK_ENCRYPTION_KEY fehlt}
  # Gemeinsame Anmeldung für app.* und admin.*, z. B. `.klonk.example`
  NUXT_SESSION_COOKIE_DOMAIN: ${KLONK_COOKIE_DOMAIN:-}

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP: app
    environment: *env
    ports:
      - "${KLONK_APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP: admin
    environment: *env
    ports:
      - "${KLONK_ADMIN_PORT:-3001}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: klonk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-klonk}
      POSTGRES_DB: klonk
    volumes:
      - klonk-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klonk"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  klonk-db:
