# Klonk selbst hosten: Proxy (Caddy) + App + Verwaltung + Anmeldung + Postgres.
# Nur ein DNS-Eintrag nötig: *.KLONK_DOMAIN (und KLONK_DOMAIN) ⇒ dieser Server.
# Konfiguration über docker/.env (Vorlage docker/.env.example). Migrationen laufen automatisch beim Start.
name: klonk

x-env: &env
  NUXT_DATABASE_URL: postgres://klonk:${POSTGRES_PASSWORD:-klonk}@postgres:5432/klonk
  NUXT_APP_SECRET: ${KLONK_APP_SECRET:?KLONK_APP_SECRET fehlt}
  NUXT_ENCRYPTION_KEY: ${KLONK_ENCRYPTION_KEY:?KLONK_ENCRYPTION_KEY fehlt}
  # Eine Anmeldung für alle Subdomains
  NUXT_SESSION_COOKIE_DOMAIN: .${KLONK_DOMAIN:?KLONK_DOMAIN fehlt}
  NUXT_PUBLIC_APP_URL: ${KLONK_PUBLIC_SCHEME:-https}://app.${KLONK_DOMAIN}
  NUXT_PUBLIC_ADMIN_URL: ${KLONK_PUBLIC_SCHEME:-https}://admin.${KLONK_DOMAIN}
  NUXT_PUBLIC_AUTH_URL: ${KLONK_PUBLIC_SCHEME:-https}://auth.${KLONK_DOMAIN}
  NUXT_PUBLIC_DOCS_URL: ${KLONK_PUBLIC_SCHEME:-https}://docs.${KLONK_DOMAIN}
  NUXT_PUBLIC_WEBSITE_URLS: ${KLONK_WEBSITE_URLS:-}
  # Lizenz (optional, alternativ in der Verwaltung) und Link zum Shop
  NUXT_LICENSE_TOKEN: ${KLONK_LICENSE_TOKEN:-}
  NUXT_PUBLIC_SHOP_URL: ${KLONK_SHOP_URL:-}
  # KI-Assistent: Standard für alle Organisationen ohne eigene Einstellung und für Privatkonten (optional)
  NUXT_AI_MODE: ${KLONK_AI_MODE:-}
  NUXT_AI_PROVIDER: ${KLONK_AI_PROVIDER:-openai}
  NUXT_AI_BASE_URL: ${KLONK_AI_BASE_URL:-}
  NUXT_AI_MODEL: ${KLONK_AI_MODEL:-}
  NUXT_AI_API_KEY: ${KLONK_AI_API_KEY:-}
  NUXT_AI_WEBLLM_MODEL: ${KLONK_AI_WEBLLM_MODEL:-}
  NUXT_AI_STUDENTS: ${KLONK_AI_STUDENTS:-tutor}
  NUXT_CLOUD_USER_QUOTA_MB: ${KLONK_CLOUD_USER_QUOTA_MB:-50}
  NUXT_CLOUD_GROUP_QUOTA_MB: ${KLONK_CLOUD_GROUP_QUOTA_MB:-200}
  # Nur gehostete Plattform: Endpunkte der Klonk-KI (JSON, siehe CLAUDE.md)
  NUXT_AI_PLATFORM_PROVIDERS: ${KLONK_AI_PLATFORM_PROVIDERS:-}
  # Lizenz automatisch beim Lizenzserver (Origin von KLONK_SHOP_URL) verlängern; false = nie nach außen verbinden
  NUXT_LICENSE_AUTO_REFRESH: ${KLONK_LICENSE_AUTO_REFRESH:-true}
  NUXT_LICENSE_SERVER_URL: ${KLONK_LICENSE_SERVER_URL:-}
  # Nur gehostete Plattform: Abgleich der Organisations-/Privat-Lizenzen mit dem Shop
  NUXT_LICENSE_SERVER_API_KEY: ${KLONK_LICENSE_SERVER_API_KEY:-}
  # Klonk ID (Betreiberzugang, optional)
  NUXT_PLATFORM_OIDC_ISSUER: ${KLONK_ID_ISSUER:-}
  NUXT_PLATFORM_OIDC_CLIENT_ID: ${KLONK_ID_CLIENT_ID:-}
  NUXT_PLATFORM_OIDC_CLIENT_SECRET: ${KLONK_ID_CLIENT_SECRET:-}
  NUXT_PLATFORM_OIDC_SCOPES: ${KLONK_ID_SCOPES:-openid profile email}
  # Name/Icon des Buttons und Gruppen-Claim, z. B. für Entra ID direkt: Microsoft, i-logos-microsoft-icon, groups
  NUXT_PLATFORM_OIDC_NAME: ${KLONK_ID_NAME:-Klonk ID}
  NUXT_PLATFORM_OIDC_ICON: ${KLONK_ID_ICON:-i-lucide-shield-user}
  NUXT_PLATFORM_OIDC_GROUPS_CLAIM: ${KLONK_ID_GROUPS_CLAIM:-groups}
  NUXT_PLATFORM_OIDC_OWNER_GROUPS: ${KLONK_ID_OWNER_GROUPS:-klonk-owners}
  NUXT_PLATFORM_OIDC_DEVELOPER_GROUPS: ${KLONK_ID_DEVELOPER_GROUPS:-klonk-developers}
  # true = auch normale Nutzer:innen melden sich mit der Klonk ID an (als Privatkonto)
  NUXT_PLATFORM_OIDC_ALLOW_USERS: ${KLONK_ID_ALLOW_USERS:-false}
  # Privatkonten per OAuth (optional); Rücksprung immer über auth.*
  NUXT_OAUTH_GOOGLE_CLIENT_ID: ${KLONK_GOOGLE_CLIENT_ID:-}
  NUXT_OAUTH_GOOGLE_CLIENT_SECRET: ${KLONK_GOOGLE_CLIENT_SECRET:-}
  NUXT_OAUTH_GOOGLE_REDIRECT_URL: ${KLONK_PUBLIC_SCHEME:-https}://auth.${KLONK_DOMAIN}/auth/google
  NUXT_OAUTH_MICROSOFT_CLIENT_ID: ${KLONK_MICROSOFT_CLIENT_ID:-}
  NUXT_OAUTH_MICROSOFT_CLIENT_SECRET: ${KLONK_MICROSOFT_CLIENT_SECRET:-}
  # common = private und geschäftliche Microsoft-Konten
  NUXT_OAUTH_MICROSOFT_TENANT: ${KLONK_MICROSOFT_TENANT:-common}
  NUXT_OAUTH_MICROSOFT_REDIRECT_URL: ${KLONK_PUBLIC_SCHEME:-https}://auth.${KLONK_DOMAIN}/auth/microsoft
  NUXT_OAUTH_GITHUB_CLIENT_ID: ${KLONK_GITHUB_CLIENT_ID:-}
  NUXT_OAUTH_GITHUB_CLIENT_SECRET: ${KLONK_GITHUB_CLIENT_SECRET:-}
  NUXT_OAUTH_GITHUB_REDIRECT_URL: ${KLONK_PUBLIC_SCHEME:-https}://auth.${KLONK_DOMAIN}/auth/github
  NUXT_OAUTH_APPLE_CLIENT_ID: ${KLONK_APPLE_CLIENT_ID:-}
  NUXT_OAUTH_APPLE_TEAM_ID: ${KLONK_APPLE_TEAM_ID:-}
  NUXT_OAUTH_APPLE_KEY_ID: ${KLONK_APPLE_KEY_ID:-}
  NUXT_OAUTH_APPLE_PRIVATE_KEY: ${KLONK_APPLE_PRIVATE_KEY:-}
  NUXT_OAUTH_APPLE_REDIRECT_URL: ${KLONK_PUBLIC_SCHEME:-https}://auth.${KLONK_DOMAIN}/auth/apple

x-app: &app
  environment: *env
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  proxy:
    image: ghcr.io/felixwochnick/klonk-proxy:${KLONK_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/proxy/Dockerfile
    environment:
      KLONK_DOMAIN: ${KLONK_DOMAIN}
      KLONK_PUBLIC_SCHEME: ${KLONK_PUBLIC_SCHEME:-}
      # internal | http | ionos | off
      KLONK_TLS: ${KLONK_TLS:-internal}
      KLONK_ACME_EMAIL: ${KLONK_ACME_EMAIL:-}
      # Website auf der Hauptdomain (leer = Weiterleitung zur App)
      KLONK_WEBSITE_UPSTREAM: ${KLONK_WEBSITE_UPSTREAM:-}
      IONOS_API_TOKEN: ${IONOS_API_TOKEN:-}
      # Zugangssperre: off | authentik (Forward-Auth, KLONK_GATE_URL = Authentik-Outpost)
      KLONK_GATE: ${KLONK_GATE:-off}
      KLONK_GATE_URL: ${KLONK_GATE_URL:-}
    ports:
      - "${KLONK_HTTP_PORT:-80}:80"
      - "${KLONK_HTTPS_PORT:-443}:443"
      - "${KLONK_HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - ./proxy/sites:/etc/caddy/sites.d:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  app:
    <<: *app
    image: ghcr.io/felixwochnick/klonk-app:${KLONK_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP: app

  admin:
    <<: *app
    image: ghcr.io/felixwochnick/klonk-admin:${KLONK_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP: admin

  auth:
    <<: *app
    image: ghcr.io/felixwochnick/klonk-auth:${KLONK_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP: auth

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: klonk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-klonk}
      POSTGRES_DB: klonk
    volumes:
      - klonk-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klonk"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  klonk-db:
  caddy-data:
  caddy-config:
