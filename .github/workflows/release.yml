# Docker-Images nach GHCR veröffentlichen, sobald ein Versions-Tag (v1.2.3) gepusht wird.
# Images: ghcr.io/<owner>/klonk-{app,admin,auth,proxy} mit Tags 1.2.3, 1.2 und latest (amd64 + arm64).
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Vorhandener Tag, der (erneut) veröffentlicht werden soll, z. B. v0.1.0
        required: true

permissions:
  contents: write
  packages: write

env:
  REF: ${{ inputs.tag || github.ref_name }}

jobs:
  image:
    name: klonk-${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: app
            dockerfile: docker/Dockerfile
            app: app
          - image: admin
            dockerfile: docker/Dockerfile
            app: admin
          - image: auth
            dockerfile: docker/Dockerfile
            app: auth
          - image: proxy
            dockerfile: docker/proxy/Dockerfile
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.REF }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/klonk-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.REF }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.REF }}
            type=semver,pattern={{major}},value=${{ env.REF }}
          # latest nur für finale Versionen (nicht für v1.0.0-rc.1)
          flavor: latest=auto
          labels: |
            org.opencontainers.image.title=klonk-${{ matrix.image }}
            org.opencontainers.image.licenses=Elastic-2.0

      - id: version
        run: echo "version=${REF#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP=${{ matrix.app }}
            KLONK_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  release:
    name: GitHub-Release
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.REF }}
      - name: Release anlegen (falls noch nicht vorhanden)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$REF" >/dev/null 2>&1 || gh release create "$REF" --verify-tag --generate-notes \
            --title "Klonk ${REF#v}" --prerelease=$([[ "$REF" == *-* ]] && echo true || echo false)
